openapi: 3.0.3
info:
  title: Universe Book Writer API
  description: |
    RESTful API for the Universe Book Writer application - a comprehensive platform for creating and managing multi-universe book series with AI assistance, real-time collaboration, and plugin extensibility.
    
    ## Features
    - User authentication and authorization
    - Universe, story, and character management
    - Real-time collaboration
    - Plugin system for franchise-specific features
    - AI-powered writing assistance
    - Advanced search and discovery
    
  version: 1.0.0
  contact:
    name: Universe Book Writer Team
    email: api@universebookwriter.com
  license:
    name: Private License
    
servers:
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: https://api.universebookwriter.com/api/v1
    description: Production server

security:
  - BearerAuth: []
  - SessionAuth: []

paths:
  # Authentication Endpoints
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user account
      description: Create a new user account with email verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: "user@example.com"
              password: "SecurePassword123!"
              firstName: "John"
              lastName: "Doe"
              acceptTerms: true
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user and receive JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "user@example.com"
              password: "SecurePassword123!"
              rememberMe: true
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout and invalidate tokens
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Initiate password reset process
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password using reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # User Management Endpoints
  /users/profile:
    get:
      tags:
        - User Management
      summary: Get current user profile
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - User Management
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/change-password:
    put:
      tags:
        - User Management
      summary: Change user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Universe Management Endpoints
  /universes:
    get:
      tags:
        - Universe Management
      summary: Get list of universes accessible to the user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, createdAt, updatedAt]
            default: updatedAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: isPublic
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Universes retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniverseListResponse'

    post:
      tags:
        - Universe Management
      summary: Create a new universe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUniverseRequest'
      responses:
        '201':
          description: Universe created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniverseDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /universes/{id}:
    get:
      tags:
        - Universe Management
      summary: Get detailed universe information
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Universe details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniverseDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Universe Management
      summary: Update universe information
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUniverseRequest'
      responses:
        '200':
          description: Universe updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniverseDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Universe Management
      summary: Delete a universe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Universe deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Story Management Endpoints
  /universes/{universeId}/stories:
    get:
      tags:
        - Story Management
      summary: Get stories in a universe
      parameters:
        - name: universeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Stories retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryListResponse'

    post:
      tags:
        - Story Management
      summary: Create a new story
      parameters:
        - name: universeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoryRequest'
      responses:
        '201':
          description: Story created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryDetail'

  /stories/{id}:
    get:
      tags:
        - Story Management
      summary: Get detailed story information
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Story details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryDetail'

  # Health Check
  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      security: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    SessionAuth:
      type: apiKey
      in: cookie
      name: session_id

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    # Authentication Schemas
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - acceptTerms
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]'
          example: "SecurePassword123!"
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: "John"
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          example: "Doe"
        acceptTerms:
          type: boolean
          example: true

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "User registered successfully"
        user:
          $ref: '#/components/schemas/UserProfile'
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        rememberMe:
          type: boolean
          default: false

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'
        token:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Token expiration time in seconds

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    # User Schemas
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [user, admin, moderator]
        emailVerified:
          type: boolean
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time

    UserPreferences:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, auto]
          default: auto
        language:
          type: string
          default: en
        timezone:
          type: string
          default: UTC
        notifications:
          $ref: '#/components/schemas/NotificationPreferences'

    NotificationPreferences:
      type: object
      properties:
        email:
          type: boolean
          default: true
        push:
          type: boolean
          default: true
        collaboration:
          type: boolean
          default: true
        updates:
          type: boolean
          default: true

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        preferences:
          $ref: '#/components/schemas/UserPreferences'

    # Universe Schemas
    UniverseListResponse:
      type: object
      properties:
        universes:
          type: array
          items:
            $ref: '#/components/schemas/UniverseSummary'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    UniverseSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
        isPublic:
          type: boolean
        owner:
          $ref: '#/components/schemas/UserSummary'
        stats:
          $ref: '#/components/schemas/UniverseStats'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UniverseDetail:
      allOf:
        - $ref: '#/components/schemas/UniverseSummary'
        - type: object
          properties:
            settings:
              $ref: '#/components/schemas/UniverseSettings'
            collaborators:
              type: array
              items:
                $ref: '#/components/schemas/CollaboratorInfo'

    CreateUniverseRequest:
      type: object
      required:
        - name
        - description
        - category
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        category:
          type: string
        isPublic:
          type: boolean
          default: false
        settings:
          $ref: '#/components/schemas/UniverseSettings'
        pluginId:
          type: string

    UpdateUniverseRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        category:
          type: string
        isPublic:
          type: boolean
        settings:
          $ref: '#/components/schemas/UniverseSettings'

    UniverseSettings:
      type: object
      properties:
        timeFormat:
          type: string
          enum: [standard, stardate, custom]
          default: standard
        calendar:
          type: string
          default: gregorian
        physics:
          type: object
        customRules:
          type: array
          items:
            type: string

    UniverseStats:
      type: object
      properties:
        storyCount:
          type: integer
        characterCount:
          type: integer
        wordCount:
          type: integer
        collaboratorCount:
          type: integer

    # Story Schemas
    StoryListResponse:
      type: object
      properties:
        stories:
          type: array
          items:
            $ref: '#/components/schemas/StorySummary'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    StorySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        genre:
          type: string
        status:
          type: string
          enum: [draft, in_progress, completed, published]
        wordCount:
          type: integer
        chapterCount:
          type: integer
        author:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StoryDetail:
      allOf:
        - $ref: '#/components/schemas/StorySummary'
        - type: object
          properties:
            settings:
              $ref: '#/components/schemas/StorySettings'
            tags:
              type: array
              items:
                type: string
            collaborators:
              type: array
              items:
                $ref: '#/components/schemas/CollaboratorInfo'

    CreateStoryRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        genre:
          type: string
        status:
          type: string
          enum: [draft, in_progress, completed, published]
          default: draft
        settings:
          $ref: '#/components/schemas/StorySettings'

    StorySettings:
      type: object
      properties:
        targetWordCount:
          type: integer
          minimum: 0
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        ageRating:
          type: string
          enum: [general, teen, mature, adult]
        warnings:
          type: array
          items:
            type: string

    # Common Schemas
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email

    CollaboratorInfo:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            role:
              type: string
              enum: [viewer, editor, admin]
            permissions:
              type: array
              items:
                type: string
            joinedAt:
              type: string
              format: date-time

    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "VAL_001"
            message:
              type: string
              example: "Validation error"
            details:
              type: object
            timestamp:
              type: string
              format: date-time
            path:
              type: string
              example: "/api/v1/users/profile"
            requestId:
              type: string
              format: uuid

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        services:
          type: object
          properties:
            database:
              type: string
              enum: [connected, disconnected]
            redis:
              type: string
              enum: [connected, disconnected]
            ai:
              type: string
              enum: [available, unavailable]

  responses:
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: Unprocessable entity - validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Too many requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: User Management
    description: User profile and account management
  - name: Universe Management
    description: Create and manage fictional universes
  - name: Story Management
    description: Create and manage stories within universes
  - name: Character Management
    description: Create and manage characters
  - name: Plugin Management
    description: Manage plugins and extensions
  - name: Collaboration
    description: Real-time collaboration features
  - name: Search
    description: Search and discovery features
  - name: System
    description: System health and monitoring
